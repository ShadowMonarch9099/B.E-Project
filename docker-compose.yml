# Run the whole app:   docker compose up --build        (then open http://localhost:3000)
# Only the database, for local development:  docker compose up -d db
# API keys: put them in backend/.env (gitignored; see backend/.env.example). The file is read at
# run time by the backend container and never copied into an image.
# Upload limit: set SAKSHYA_MAX_FILE_MB in your shell or a .env file next to this one (default 200).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sakshya
      POSTGRES_PASSWORD: sakshya
      POSTGRES_DB: sakshya
    # 5433 on the host, so it does not clash with a PostgreSQL already installed on 5432.
    ports: ["${SAKSHYA_DB_PORT:-5433}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakshya -d sakshya"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    ports: ["${SAKSHYA_BACKEND_PORT:-8000}:8000"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      SAKSHYA_MAX_FILE_MB: ${SAKSHYA_MAX_FILE_MB:-200}
      SAKSHYA_DATABASE_URL: postgresql+psycopg://sakshya:sakshya@db:5432/sakshya
      SAKSHYA_DATA_DIR: /data
      HF_HOME: /data/hf
    # uploads, page images and the downloaded models (about 5 GB after first start)
    volumes: ["appdata:/data"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports: ["${SAKSHYA_FRONTEND_PORT:-3000}:3000"]
    environment:
      SAKSHYA_MAX_FILE_MB: ${SAKSHYA_MAX_FILE_MB:-200}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
